<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asiful Mamun - Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  // Change the accent color here (e.g. green: #22a35a)
  tailwind.config = {
    theme: { extend: {
      colors: { base: '#252836', accent: '#3b82f6' },
      fontFamily: { serif: ['"Cormorant Garamond"', 'serif'], sans: ['Poppins', 'sans-serif'] }
    } }
  }
</script>
<style>
  html, body { height: 100%; margin: 0; }
  /* Social buttons sit on an arc; position set with CSS variables */
  .orbit-btn { position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%); }
</style>
</head>
<body class="bg-white font-sans text-slate-900">
<section class="relative min-h-screen overflow-hidden">
  <div class="mx-auto grid min-h-screen max-w-6xl grid-cols-1 items-center gap-8 px-6 py-16 lg:grid-cols-2">

    <!-- Text side -->
    <div class="order-2 lg:order-1">
      <p class="font-serif text-4xl sm:text-5xl">Hello! I’m</p>
      <h1 class="mt-2 font-serif text-5xl font-semibold sm:text-7xl">Asiful Mamun</h1>
      <svg class="mt-1 h-3 w-56 text-accent" viewBox="0 0 230 12" fill="none" aria-hidden="true">
        <path d="M2 8c14-8 20 4 34-2s20 4 34-2 20 4 34-2 20 4 34-2 20 4 34-2 20 4 34-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p class="mt-8 max-w-md text-slate-500">Web Developer building fast, clean websites.</p>

      <div class="mt-10 flex items-center gap-8">
        <a href="#" class="inline-flex items-center gap-2 rounded-full border border-slate-300 px-7 py-4 text-sm transition hover:border-accent hover:bg-accent hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent">
          Get Resume
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
        </a>
      </div>

      <a href="#" class="mt-12 inline-flex items-center gap-4 text-slate-500 transition hover:text-slate-900">
        <span class="flex h-16 w-16 items-center justify-center rounded-full bg-slate-100 text-accent">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </span>
        Watch Video
      </a>
    </div>

    <!-- Image side -->
    <div class="order-1 flex justify-center lg:order-2">
      <div class="relative aspect-[4/5] w-full max-w-md">

        <!-- Orbit rings -->
        <svg class="absolute inset-0 h-full w-full" viewBox="0 0 400 500" fill="none" aria-hidden="true">
          <circle cx="170" cy="250" r="200" stroke="rgba(15,23,42,.14)"/>
          <circle cx="170" cy="250" r="165" stroke="rgba(15,23,42,.08)"/>
        </svg>

        <!-- Replace this block with your <img src="..." class="h-full w-full object-contain object-bottom"> -->
        <div class="absolute inset-x-6 bottom-0 top-8 flex items-center justify-center rounded-t-[40%] border border-dashed border-slate-300 bg-slate-50 text-sm text-slate-500">
          Your image here
        </div>

        <!-- Social buttons on the arc (x, y in %) -->
        <a href="#" aria-label="Facebook" style="--x:78%;--y:18%" class="orbit-btn flex h-14 w-14 items-center justify-center rounded-full border border-slate-300 bg-white text-slate-900 transition hover:border-accent hover:text-accent">
          <svg class="h-5 w-5 text-accent" viewBox="0 0 24 24" fill="currentColor"><path d="M14 8.5V6.8c0-.8.2-1.3 1.4-1.3H17V2.6C16.700 2.600 15.800 2.500 14.800 2.500 12.500 2.500 11 3.900 11 6.400v2.100H8.500V12H11v9.500h3V12h2.400l.4-3.500z"/></svg>
        </a>
        <a href="#" aria-label="Dribbble" style="--x:91%;--y:38%" class="orbit-btn flex h-14 w-14 items-center justify-center rounded-full border border-slate-300 bg-white text-slate-900 transition hover:border-accent hover:text-accent">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M5 5.500c4 1 8 5 10.500 13M2.800 11c5 .3 10-.7 14-4M8.500 2.800c3 3.500 5 8 5.800 14.500"/></svg>
        </a>
        <a href="#" aria-label="Behance" style="--x:93%;--y:62%" class="orbit-btn flex h-14 w-14 items-center justify-center rounded-full border border-slate-300 bg-white text-sm font-semibold text-accent transition hover:border-accent">
          Bē
        </a>
        <a href="#" aria-label="LinkedIn" style="--x:84%;--y:84%" class="orbit-btn flex h-14 w-14 items-center justify-center rounded-full border border-slate-300 bg-white text-slate-900 transition hover:border-accent hover:text-accent">
          <svg class="h-5 w-5 text-accent" viewBox="0 0 24 24" fill="currentColor"><path d="M4.500 3A2 2 0 1 0 4.500 7 2 2 0 0 0 4.500 3zM3 9h3v12H3zm6 0h2.900v1.700c.5-.9 1.700-2 3.600-2 3.400 0 4 2.200 4 5.100V21h-3v-6.200c0-1.500 0-3.300-2-3.300s-2.400 1.600-2.400 3.200V21H9z"/></svg>
        </a>
      </div>
    </div>
  </div>
</section>
</body>
</html>
